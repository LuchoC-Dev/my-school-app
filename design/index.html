<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>My School — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F0E8;font-family:'Caveat',cursive;color:#2A2016;min-height:100vh;display:flex;flex-direction:column}

.page-hdr{padding:20px 44px 0;display:flex;align-items:baseline;gap:10px}
.page-hdr h1{font-size:26px;font-weight:700}
.page-hdr p{font-size:15px;color:#8B7355}

.nav{display:flex;gap:7px;padding:13px 44px 11px;border-bottom:1.5px solid #D4C9B5;flex-wrap:wrap}
.tab{font-family:'Caveat',cursive;font-size:15px;font-weight:500;padding:5px 15px;border-radius:999px;
  border:1.5px solid #BFAF9A;background:transparent;color:#5A4A35;cursor:pointer;
  display:flex;align-items:center;gap:5px;white-space:nowrap}
.tab.active{background:#2A2016;color:#F5F0E8;border-color:#2A2016}

.group-lbl{font-size:11px;font-weight:700;color:#9A8B77;letter-spacing:.5px;text-transform:uppercase;
  padding:10px 44px 0;align-self:flex-start}

.view-frame{flex:1;border:none;width:100%;min-height:calc(100vh - 130px)}
</style>
</head>
<body>

<div class="page-hdr">
  <h1>🏫 My School — Wireframes</h1>
  <p>MVP · React Native · 10 vistas</p>
</div>

<nav class="nav" id="nav">
  <!-- Courses -->
  <button class="tab active" onclick="show('views/course-list.html',0)">🏫 Course List</button>
  <button class="tab" onclick="show('views/course-create.html',1)">➕ Course Create</button>
  <button class="tab" onclick="show('views/course-view.html',2)">📖 Course View</button>
  <!-- Activities -->
  <button class="tab" onclick="show('views/activities-list.html',3)">📋 Activities List</button>
  <button class="tab" onclick="show('views/task-list.html',4)">✅ Task List</button>
  <button class="tab" onclick="show('views/task-view.html',5)">🔍 Task View</button>
  <button class="tab" onclick="show('views/task-create.html',6)">✏️ Task Create</button>
  <button class="tab" onclick="show('views/project-list.html',7)">📁 Project List</button>
  <button class="tab" onclick="show('views/project-view.html',8)">🔍 Project View</button>
  <button class="tab" onclick="show('views/project-create.html',9)">✏️ Project Create</button>
  <!-- Calendar -->
  <button class="tab" onclick="show('views/calendar-view.html',10)">📅 Calendar</button>
  <button class="tab" onclick="show('views/calendar-day.html',11)">☀️ Day View</button>
  <button class="tab" onclick="show('views/calendar-week.html',12)">📆 Week View</button>
  <button class="tab" onclick="show('views/calendar-month.html',13)">🗓 Month View</button>
</nav>

<iframe class="view-frame" id="frame" src="views/course-list.html"></iframe>

<script>
const tabs = document.querySelectorAll('#nav .tab');
function show(src, idx) {
  document.getElementById('frame').src = src;
  tabs.forEach((t, i) => t.classList.toggle('active', i === idx));
}
</script>
</body>
</html>
