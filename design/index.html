<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>My School — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F0E8;font-family:'Caveat',cursive;color:#2A2016;min-height:100vh;display:flex;flex-direction:column}

.page-hdr{padding:20px 44px 0;display:flex;align-items:baseline;gap:10px}
.page-hdr h1{font-size:26px;font-weight:700}
.page-hdr p{font-size:15px;color:#8B7355}

.nav{display:flex;gap:7px;padding:13px 44px 11px;border-bottom:1.5px solid #D4C9B5;flex-wrap:wrap}
.group{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.group-sep{width:1px;height:22px;background:#D4C9B5;margin:0 4px;align-self:center}
.group-lbl{font-size:10px;font-weight:700;color:#BFAF9A;text-transform:uppercase;letter-spacing:.4px;margin-right:2px}

.tab{font-family:'Caveat',cursive;font-size:14px;font-weight:500;padding:4px 12px;border-radius:999px;
  border:1.5px solid #BFAF9A;background:transparent;color:#5A4A35;cursor:pointer;
  display:flex;align-items:center;gap:4px;white-space:nowrap}
.tab.active{background:#2A2016;color:#F5F0E8;border-color:#2A2016}

.view-frame{flex:1;border:none;width:100%;min-height:calc(100vh - 130px)}
</style>
</head>
<body>

<div class="page-hdr">
  <h1>🏫 My School — Wireframes</h1>
  <p>MVP · React Native · 16 vistas</p>
</div>

<nav class="nav" id="nav">

  <!-- Courses -->
  <div class="group">
    <span class="group-lbl">Courses</span>
    <button class="tab active" onclick="show('views/course-list.html',0)">🏫 List</button>
    <button class="tab" onclick="show('views/course-create.html',1)">➕ Create</button>
    <button class="tab" onclick="show('views/course-view.html',2)">📖 View</button>
  </div>

  <div class="group-sep"></div>

  <!-- Activities container -->
  <div class="group">
    <span class="group-lbl">Container</span>
    <button class="tab" onclick="show('views/activities-list.html',3)">📋 Activities</button>
  </div>

  <div class="group-sep"></div>

  <!-- Tasks -->
  <div class="group">
    <span class="group-lbl">Tasks</span>
    <button class="tab" onclick="show('views/task-list.html',4)">☑️ List</button>
    <button class="tab" onclick="show('views/task-view.html',5)">🔍 View</button>
    <button class="tab" onclick="show('views/task-create.html',6)">✏️ Create</button>
  </div>

  <div class="group-sep"></div>

  <!-- Activities -->
  <div class="group">
    <span class="group-lbl">Activities</span>
    <button class="tab" onclick="show('views/activity-list.html',7)">📋 List</button>
    <button class="tab" onclick="show('views/activity-view.html',8)">🔍 View</button>
    <button class="tab" onclick="show('views/activity-create.html',9)">✏️ Create</button>
  </div>

  <div class="group-sep"></div>

  <!-- Projects -->
  <div class="group">
    <span class="group-lbl">Projects</span>
    <button class="tab" onclick="show('views/project-list.html',10)">📁 List</button>
    <button class="tab" onclick="show('views/project-view.html',11)">🔍 View</button>
    <button class="tab" onclick="show('views/project-create.html',12)">✏️ Create</button>
  </div>

  <div class="group-sep"></div>

  <!-- Calendar -->
  <div class="group">
    <span class="group-lbl">Calendar</span>
    <button class="tab" onclick="show('views/calendar-view.html',13)">📅 View</button>
    <button class="tab" onclick="show('views/calendar-day.html',14)">☀️ Day</button>
    <button class="tab" onclick="show('views/calendar-week.html',15)">📆 Week</button>
    <button class="tab" onclick="show('views/calendar-month.html',16)">🗓 Month</button>
  </div>

</nav>

<iframe class="view-frame" id="frame" src="views/course-list.html"></iframe>

<script>
const tabs = document.querySelectorAll('#nav .tab');
function show(src, idx) {
  document.getElementById('frame').src = src;
  tabs.forEach((t, i) => t.classList.toggle('active', i === idx));
}
</script>
</body>
</html>
